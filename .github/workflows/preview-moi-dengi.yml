name: Preview «Фин»

on:
  push:
    branches:
      - claude/dengi-app-checklist-677mcj
    paths:
      - 'moi-dengi/www/**'
      - '.github/workflows/preview-moi-dengi.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: moi-dengi/www

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
