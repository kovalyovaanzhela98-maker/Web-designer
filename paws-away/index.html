<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0878E8">
<title>Paws Away: Cat Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0878E8;--dblue:#0750A8;--deep:#06366F;--sky:#38BDF8;--cta:#FF9F1C;--yel:#FFD43B;--grn:#32D583;--vio:#8B5CF6;--txt:#14324A;--red:#ff5d73;--spd:1;
  --panel:linear-gradient(#2b9cf7,#0878E8);
  --ts:0 2px 0 rgba(7,80,168,.75);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--deep);color:#fff;font-family:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0;transition:transform .1s}
button:active{transform:scale(.94)}
#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;
  background:radial-gradient(90% 55% at 50% 38%,rgba(56,189,248,.45),transparent 70%),linear-gradient(#0a7ff0 0%,#0878E8 35%,#06498f 75%,#06366F 100%)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.screen.on{display:flex}
.panel{background:var(--panel);border:3px solid rgba(255,255,255,.55);border-radius:22px;box-shadow:0 5px 0 var(--dblue),0 10px 18px rgba(3,30,80,.35),inset 0 2px 0 rgba(255,255,255,.45)}
.btn{background:linear-gradient(#ffc84d,var(--cta));color:#fff;font-weight:700;font-size:22px;text-shadow:0 2px 0 rgba(170,80,0,.8);padding:14px 26px;border-radius:99px;border:3px solid #ffe3a0;box-shadow:0 6px 0 #c46f00,0 12px 18px rgba(3,30,80,.35),inset 0 3px 0 rgba(255,255,255,.55)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #c46f00,inset 0 3px 0 rgba(255,255,255,.55)}
.btn.sec{background:linear-gradient(#5cc6ff,#1c86ee);text-shadow:var(--ts);border-color:#d3ecff;box-shadow:0 6px 0 var(--dblue),0 12px 18px rgba(3,30,80,.35),inset 0 3px 0 rgba(255,255,255,.5)}
.btn.sm{font-size:15px;padding:9px 16px;border-width:2px;box-shadow:0 4px 0 var(--dblue),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.sm:active{transform:translateY(3px)}
.btn[disabled]{filter:grayscale(.8) brightness(.9);opacity:.7;pointer-events:none}
.ibtn{width:46px;height:46px;border-radius:50%;background:linear-gradient(#5cc6ff,#1c86ee);border:3px solid #d3ecff;font-size:19px;display:grid;place-items:center;box-shadow:0 4px 0 var(--dblue),inset 0 2px 0 rgba(255,255,255,.5)}
.ibtn.act{background:linear-gradient(#ffc84d,var(--cta));box-shadow:0 4px 0 #c46f00,inset 0 2px 0 rgba(255,255,255,.5)}

/* ---------- MAIN MENU ---------- */
.topbar{display:flex;gap:6px;align-items:center}
.pill{flex:1;height:42px;border-radius:99px;background:linear-gradient(#1f8cf0,#075cc4);border:3px solid #d3ecff;display:flex;align-items:center;padding-right:5px;gap:3px;box-shadow:0 3px 0 var(--dblue),inset 0 2px 0 rgba(255,255,255,.3);font-weight:700;font-size:16px;text-shadow:var(--ts);min-width:0}
.pill .ic{width:40px;height:44px;margin:-4px 0 -4px -6px;display:grid;place-items:center;font-size:27px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.pill b{flex:1;text-align:center;white-space:nowrap}
.pill .pl{width:24px;height:24px;border-radius:50%;background:linear-gradient(#6ff0a5,#1fbf70);border:2px solid #fff;display:grid;place-items:center;font-size:17px;line-height:1;box-shadow:0 2px 0 #12803a;flex:none}
.mteamp{margin-top:10px;padding:8px 8px 10px}
.mth{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;font-weight:600;font-size:17px;text-shadow:var(--ts)}
.mth .i{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:50%;background:rgba(255,255,255,.3);font-size:13px;margin-left:6px}
.mteam{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-top:8px}
.mc{border-radius:16px;padding:12px 3px 5px;text-align:center;position:relative;border:3px solid;box-shadow:0 3px 0 rgba(3,30,80,.35),inset 0 2px 0 rgba(255,255,255,.4);color:#fff}
.mc svg{width:100%;max-width:54px;height:auto;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.mc .lv{margin:3px 2px;border-radius:99px;font-size:13px;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.35);padding:1px 0;background:rgba(0,0,0,.25)}
.mc .xp{height:15px;border-radius:99px;background:rgba(6,54,111,.6);position:relative;overflow:hidden;margin:0 1px}
.mc .xp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#fff,rgba(255,255,255,.5));opacity:.9}
.mc .xp span{position:absolute;inset:0;font-size:9.5px;line-height:15px;font-weight:700;color:#14324A;mix-blend-mode:normal;text-shadow:0 0 3px #fff}
.mc .paw{position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;margin-top:12px}
.island{flex:1;min-height:0;position:relative;display:grid;place-items:center}
.island svg.house{height:92%;max-height:340px;width:auto;filter:drop-shadow(0 16px 12px rgba(2,24,70,.45));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.sq{border-radius:20px;padding:6px 4px 5px;text-align:center;font-size:14px;font-weight:700;text-shadow:var(--ts);position:relative;flex:none}
.sq .e{font-size:36px;line-height:1.1;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.sq .dot{position:absolute;top:-8px;right:-8px;width:25px;height:25px;border-radius:50%;background:#ff3b5c;border:2px solid #fff;font-style:normal;font-weight:700;display:grid;place-items:center;font-size:15px}
.island .sq{position:absolute;top:12px;width:86px;z-index:2}
.arr{position:absolute;top:50%;margin-top:-28px;width:56px;height:56px;border-radius:50%;background:linear-gradient(#5cc6ff,#1c86ee);border:4px solid #d3ecff;box-shadow:0 5px 0 var(--dblue),inset 0 2px 0 rgba(255,255,255,.5);display:grid;place-items:center;font-size:34px;font-weight:700;line-height:1;padding-bottom:4px}
.arr:active{transform:translateY(4px);box-shadow:0 1px 0 var(--dblue)}
.chap{margin:4px auto 0;width:min(310px,84%);padding:9px 14px 11px;text-align:center}
.chap small{font-size:13px;opacity:.95}
.chap h2{margin:0 0 5px;font-size:25px;text-shadow:var(--ts);line-height:1.1}
.chap ul{list-style:none;margin:0;padding:0;text-align:left;font-size:13.5px}
.chap li{display:flex;gap:7px;align-items:center;margin:2px 0;text-shadow:0 1px 0 rgba(7,80,168,.6)}
.star{font-size:18px;filter:grayscale(1) brightness(1.6) opacity(.5)}.star.on{filter:drop-shadow(0 2px 0 #b87400)}
.dots{display:flex;gap:9px;justify-content:center;padding:9px 0 10px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:var(--yel);box-shadow:0 0 0 2px #fff;transform:scale(1.15)}
.bottom{display:flex;gap:10px;align-items:center;justify-content:center}
.bottom .sq{width:80px;height:84px;font-size:13px;display:flex;flex-direction:column;justify-content:center}
.bottom .btn{flex:1;min-width:0;font-size:34px;height:104px;padding:0;display:flex;align-items:center;justify-content:center;gap:10px}
.bottom .btn span{font-size:38px}

/* ---------- TEAM ---------- */
#team h2{margin:10px 0 2px;text-align:center;text-shadow:var(--ts);font-size:28px}
#team p{margin:0 0 8px;text-align:center;font-size:14px;text-shadow:var(--ts)}
#cats{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:9px;align-content:start;padding:6px 2px}
.cc{border-radius:18px;padding:9px;display:flex;gap:8px;align-items:center;position:relative;text-align:left;background:linear-gradient(#fff,#d6e9ff);border:3px solid #fff;color:var(--txt);box-shadow:0 4px 0 var(--dblue)}
.cc.sel{border-color:var(--yel);background:linear-gradient(#fff6c8,#ffe27a)}
.cc .face{width:52px;height:52px;flex:none}
.cc.lock .face{filter:grayscale(1) brightness(.6)}
.cc b{display:block;font-size:16px}
.cc small{font-size:12px;opacity:.85}
.cc .cl2{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;color:var(--txt);font-weight:700;margin:2px 0}
.cc .unl{position:absolute;right:5px;top:5px;font-size:11px;padding:4px 8px}
.foot{display:flex;gap:10px;justify-content:center;padding-top:12px}

/* ---------- HUD / STAGE 1 ---------- */
.hud{display:flex;align-items:center;gap:8px;padding-bottom:6px}
.hud .t{flex:1;font-weight:700;line-height:1.1;font-size:19px;text-shadow:var(--ts)}
.hud .t small{display:block;font-weight:500;font-size:12px}
.luck{height:26px;border-radius:99px;background:rgba(6,54,111,.6);position:relative;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 0 var(--dblue)}
.luck i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--grn),var(--sky),var(--vio));transition:width .25s}
.luck span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;text-shadow:0 1px 2px rgba(6,54,111,.9)}
.mid{display:flex;gap:8px;align-items:center;margin:8px 0}
.combo{display:flex;align-items:center;gap:6px;background:rgba(6,54,111,.5);padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;flex:1;border:2px solid rgba(255,255,255,.45)}
.combo .pip{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.3);transition:.2s}
.inv{display:flex;gap:5px}
.slot{width:36px;height:36px;border-radius:12px;background:rgba(6,54,111,.45);border:2px dashed rgba(255,255,255,.5);display:grid;place-items:center;font-size:19px}
.slot.full{border:2px solid #fff;background:linear-gradient(#ffe38a,var(--cta))}
#gridwrap{flex:1;min-height:0;display:grid;place-items:center}
#board{padding:7px;border-radius:22px;background:rgba(6,54,111,.55);border:3px solid rgba(255,255,255,.55);box-shadow:0 5px 0 var(--dblue);overflow:hidden}
#grid{display:grid;gap:4px}
.cell{position:relative;border-radius:11px;background:rgba(2,24,70,.35);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.tile{position:absolute;inset:0;width:100%;height:100%;border-radius:11px;background:linear-gradient(#ffffff,#cfe3ff);box-shadow:inset 0 -5px 0 #8fb3ea,0 3px 0 #4f78bd;display:grid;place-items:center;color:var(--blue)}
.tile:active{transform:scale(.9)}
.tile svg.ar{width:56%;height:56%}
.tile.f1{background:linear-gradient(#f2fff6,#bdf0d0);box-shadow:inset 0 0 0 3px var(--grn),inset 0 -5px 0 rgba(0,100,50,.2),0 3px 0 #1f9d6a,0 0 10px rgba(50,213,131,.8)}
.tile.f2{background:linear-gradient(#f0faff,#bfe6ff);box-shadow:inset 0 0 0 3px var(--sky),inset 0 -5px 0 rgba(0,70,140,.2),0 3px 0 #1a7fc0,0 0 10px rgba(56,189,248,.9)}
.tile.f3{background:linear-gradient(#f8f0ff,#dccbff);box-shadow:inset 0 0 0 3px var(--vio),inset 0 -5px 0 rgba(70,20,140,.2),0 3px 0 #6d4fd0,0 0 14px rgba(139,92,246,1)}
.tile.shake{animation:shake .35s}
.tile.blocker{outline:3px solid var(--red);animation:shake .35s}
.tile.hint{animation:hint .6s ease-in-out 3}
.tile.fly{z-index:5;pointer-events:none;animation:fly calc(.4s / var(--spd)) cubic-bezier(.5,0,1,.6) forwards}
.cell.gone .tile{display:none}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes hint{50%{transform:scale(1.18);filter:brightness(1.25)}}
@keyframes fly{to{transform:translate(calc(var(--dx)*300%),calc(var(--dy)*300%));opacity:0}}
.reveal{position:absolute;inset:-6px;z-index:6;display:grid;place-items:center;pointer-events:none;animation:rev calc(.9s / var(--spd)) ease-out forwards}
.reveal svg{width:100%;height:100%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.reveal em{position:absolute;bottom:-4px;font-style:normal;font-size:11px;font-weight:700;background:var(--cta);border:2px solid #fff;padding:0 6px;border-radius:99px;white-space:nowrap}
.reveal .ev{font-size:26px}
@keyframes rev{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.25);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:translateY(-26px) scale(.9);opacity:0}}
#team1{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.tc{border-radius:15px;padding:6px 2px 4px;text-align:center;position:relative;border:3px solid #fff;transition:.2s;box-shadow:0 3px 0 rgba(3,30,80,.35),inset 0 2px 0 rgba(255,255,255,.35)}
.tc.hit{transform:scale(1.12);border-color:var(--yel);box-shadow:0 0 14px var(--yel)}
.tc svg{width:40px;height:40px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.tc.nf svg{filter:grayscale(1) brightness(.3)}
.tc b{display:block;font-size:13px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.tc small{display:block;font-size:10px;line-height:1.1;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.tc .ci{position:absolute;top:-7px;left:-5px;font-size:14px}

/* ---------- BATTLE ---------- */
.hud2{display:flex;gap:5px;align-items:center}
.hud2 .pill{height:38px;font-size:14px;flex:1}
.hud2 .pill .ic{width:32px;font-size:21px;margin-left:-5px}
.hud2 .pill.hp{flex:1.2;background:linear-gradient(#ff7a8c,#e0334f)}
#cwrap{flex:1;min-height:0;display:grid;place-items:center;position:relative;margin:7px 0}
#cv{max-width:100%;max-height:100%;aspect-ratio:360/540;border-radius:20px;border:3px solid #fff;box-shadow:0 5px 0 var(--dblue),0 10px 20px rgba(3,30,80,.4);touch-action:none}
#status{text-align:center;font-size:13px;font-weight:600;height:18px;text-shadow:var(--ts)}
#tray{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
#tray .tc{cursor:pointer;padding-bottom:3px}
#tray .tc.sel{border-color:var(--yel);box-shadow:0 0 0 3px rgba(255,212,59,.5),0 0 16px var(--yel);transform:translateY(-5px)}
#tray .tc.placed{opacity:.55}
#tray .tc.poor{filter:grayscale(.85) brightness(.85)}
#tray .cost{display:inline-block;margin-top:1px;padding:0 7px;border-radius:99px;background:rgba(6,54,111,.7);font-size:11px;font-weight:700}
.pips{display:flex;gap:2px;justify-content:center;height:5px}
.pips i{width:5px;height:5px;border-radius:50%;background:#fff}
.ctrl{display:flex;gap:8px;align-items:center;margin-top:9px}
.ctrl .btn.sm{height:50px;padding:0 14px;display:flex;align-items:center;gap:5px}
#go{flex:1;height:54px;font-size:19px;padding:0 10px;display:flex;align-items:center;justify-content:center}
#trapmenu{position:absolute;z-index:6;background:var(--panel);border:3px solid #fff;border-radius:18px;padding:10px;display:none;flex-direction:column;gap:6px;box-shadow:0 7px 0 var(--dblue);min-width:210px}
#trapmenu.on{display:flex}
#trapmenu h4{margin:0 0 2px;font-size:14px;text-shadow:var(--ts)}
#trapmenu button{background:linear-gradient(#fff,#d6e9ff);color:var(--txt);padding:9px 10px;border-radius:12px;text-align:left;font-size:14px;font-weight:600;box-shadow:0 3px 0 var(--dblue)}
#trapmenu button[disabled]{opacity:.5}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:38px;font-weight:700;pointer-events:none;opacity:0;text-shadow:0 4px 0 var(--dblue),0 8px 20px rgba(0,0,0,.35)}
#banner.show{animation:ban 1.8s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-20px)}}

/* ---------- MODAL ---------- */
.modal{position:absolute;inset:0;z-index:20;background:rgba(6,54,111,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.mbox{width:100%;background:linear-gradient(#3aa6fa,#0a6fdc);border:4px solid #fff;border-radius:26px;padding:18px;text-align:center;box-shadow:0 7px 0 var(--dblue),0 24px 50px rgba(0,20,70,.5);animation:mpop .3s;text-shadow:var(--ts)}
@keyframes mpop{from{transform:scale(.8);opacity:0}}
.mbox h3{margin:0 0 4px;font-size:27px}
.mbox p{margin:4px 0 12px;font-size:14.5px}
.opts{display:flex;flex-direction:column;gap:9px;margin:10px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:16px;background:linear-gradient(#fff,#d6e9ff);color:var(--txt);border:4px solid transparent;text-shadow:none;box-shadow:0 4px 0 var(--dblue)}
.opt:active{transform:translateY(3px) scale(.98)}
.opt.t1{border-color:var(--grn)}.opt.t2{border-color:var(--sky)}.opt.t3{border-color:var(--vio)}
.opt .ic{font-size:30px;width:40px;text-align:center}
.opt b{display:block;font-size:16px}.opt small{font-size:13px;opacity:.85}
.mbox p.big{font-size:56px;margin:0}
.fr{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.fr .tc{width:58px}
.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;border:2px solid #fff;color:var(--txt);text-shadow:none}
.stars{font-size:38px;letter-spacing:4px}
#toast{position:absolute;left:50%;top:72px;transform:translateX(-50%);z-index:30;background:rgba(6,54,111,.92);padding:8px 16px;border-radius:99px;font-size:15px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;border:2px solid #fff;max-width:96%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <section id="menu" class="screen">
    <div class="topbar">
      <div class="pill"><span class="ic">🪙</span><b id="pCoin">0</b><span class="pl">+</span></div>
      <div class="pill"><span class="ic">🍖</span><b id="pFood">0</b><span class="pl">+</span></div>
      <div class="pill"><span class="ic">💎</span><b id="pGem">0</b><span class="pl">+</span></div>
      <button class="ibtn" id="bSnd" style="width:46px;height:46px;font-size:22px">⚙️</button>
    </div>
    <div class="panel mteamp">
      <div class="mth"><span>Моя команда <span class="i" id="bInfo">i</span></span><button class="btn sec sm" id="bTeam">✏️ Изменить</button></div>
      <div class="mteam" id="mteam"></div>
    </div>
    <div class="stage">
      <div class="island" id="island">
        <button class="sq panel" style="left:0" data-soon><span class="e">📋</span>Задания<i class="dot">!</i></button>
        <button class="sq panel" style="right:0" data-soon><span class="e">🃏</span>Коллекции</button>
        <button class="arr" id="aPrev" style="left:0">‹</button>
        <button class="arr" id="aNext" style="right:0">›</button>
        <div id="houseBox" style="display:contents"></div>
      </div>
      <div class="chap panel" id="chap"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="bottom">
      <button class="sq panel" data-soon><span class="e">🎁</span>Награды<i class="dot">!</i></button>
      <button class="btn" id="bPlay"><span>🐾</span>ИГРАТЬ</button>
      <button class="sq panel" data-soon><span class="e">🎒</span>Профиль</button>
    </div>
  </section>

  <section id="team" class="screen">
    <h2>Собери команду</h2>
    <p>Выбери ровно 5 котов. 30 фрагментов класса — новый кот.</p>
    <div id="cats"></div>
    <div class="foot"><button class="btn sec" id="tOk">Готово</button></div>
  </section>

  <section id="s1" class="screen">
    <div class="hud">
      <div class="t" id="s1t">Уровень 1<small>Этап 1 · Подготовка</small></div>
      <button class="ibtn" id="s1h">💡</button><button class="ibtn" id="s1x">⏩</button><button class="ibtn" id="s1p">⏸</button>

function beep(f,d=.08,type='sine',v=.06){
  if(!soundOn)return;const n=performance.now();if(n-lastBeep<25)return;lastBeep=n;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}
}

function toast(t,ms=1500){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function modal(html){$('mbox').innerHTML=html;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on');$('mbox').innerHTML=''}
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');

let G=null,W=null,paused=false,speed=1,menuLvl=1;
function setSpeed(){$('s1x').classList.toggle('act',speed>1);$('s2x').classList.toggle('act',speed>1);document.documentElement.style.setProperty('--spd',speed)}
const hasB=id=>!!(G&&G.b[id]);

$('bInfo').onclick=()=>toast('Уровень кота растёт после побед и усиливает урон');
$('bSnd').onclick=()=>{soundOn=!soundOn;toast('Звук: '+(soundOn?'вкл':'выкл'))};
$('bTeam').onclick=()=>{renderTeam();show('team')};
$('bPlay').onclick=()=>{if(save.team.length!==5){renderTeam();show('team');return}startLevel(menuLvl)};
function renderTeam(){
  const sel=new Set(save.team);
  $('cats').innerHTML=CATS.map(c=>{
    const un=save.unlocked.includes(c.id),k=CLASSES[c.cls];
    return `<div class="cc ${sel.has(c.id)?'sel':''} ${un?'':'lock'}" data-id="${c.id}">

      <div><b>${un?c.name:'???'}</b><span class="cl2" style="background:${k.color}">${k.icon} ${k.name}</span>
      <small style="display:block">${un?(sel.has(c.id)?'в команде':'нажми, чтобы выбрать'):'Фрагменты: '+save.frags[c.cls]+'/30'}</small></div>
      ${!un&&save.frags[c.cls]>=30?`<button class="btn sm unl" data-un="${c.id}">Открыть</button>`:''}</div>`}).join('');

$('cats').onclick=e=>{
  const u=e.target.closest('[data-un]');
  if(u){const c=catById(u.dataset.un);save.frags[c.cls]-=30;save.unlocked.push(c.id);persist();sfx.bonus();toast('Новый кот: '+c.name+'!');renderTeam();return}
  const el=e.target.closest('.cc');if(!el)return;const id=el.dataset.id;
  if(!save.unlocked.includes(id))return toast('Копи фрагменты — побеждай боссов');
  const i=save.team.indexOf(id);
  if(i>=0)save.team.splice(i,1);else if(save.team.length<5)save.team.push(id);else toast('Уже 5 котов — убери кого-нибудь');

};
$('tOk').onclick=()=>renderMenu();

/* ============================================================
   LEVEL SETUP
   ============================================================ */
function startLevel(lvl){
  G={lvl,b:{},inv:[],picks:0,luck:0,thr:3,lastFrame:1,combo:{cls:null,n:0},opened:0,
     pool:{1:[],2:[],3:[]},tunaBonus:0,
     team:save.team.map(id=>{const c=catById(id);return{c,level:1,found:false,dmgB:0,asB:0,meta:metaOf(id).lv,buffs:[],spot:-1,cd:0,shots:0,first:true,sharp:0}})};
  for(let i=1;i<BONUSES.length;i++)G.pool[BONUSES[i].t].push(i);
  buildGrid();speed=1;paused=false;setSpeed();
  $('s1p').textContent='⏸';
  show('s1');renderS1();layoutGrid();
  toast('Тапай блок — он улетит по стрелке, если путь свободен',2600);
}

/* ============================================================
   STAGE 1 — TAP AWAY
   ============================================================ */
const DIRV=[[0,1],[0,-1],[1,0],[-1,0]];      // → ← ↓ ↑
const DIRDEG=[0,180,90,270];
function blockerOf(i,gone){
  const b=G.boxes[i],[dr,dc]=DIRV[b.dir];let r=b.r+dr,c=b.c+dc;
  while(r>=0&&r<G.R&&c>=0&&c<G.C){const j=r*G.C+c;if(!(gone?gone[j]:G.boxes[j].gone))return j;r+=dr;c+=dc}
  return -1;
}
function buildGrid(){
  const R=8,C=G.lvl%2===1?8:9;
  G.R=R;G.C=C;G.total=R*C;G.boxes=[];
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)G.boxes.push({r,c,dir:ri(0,3),frame:wpick(FRAMES.map(f=>f.w)),gone:false});
  for(let it=0;it<3000;it++){ // гарантируем, что поле можно полностью очистить
    const gone=G.boxes.map(()=>false);let moved=true;
    while(moved){moved=false;G.boxes.forEach((b,i)=>{if(!gone[i]&&blockerOf(i,gone)<0){gone[i]=true;moved=true}})}
    const stuck=G.boxes.map((b,i)=>i).filter(i=>!gone[i]);
    if(!stuck.length){
      if(G.boxes.filter((b,i)=>blockerOf(i)<0).length>=6)break;
      G.boxes.forEach(b=>b.dir=ri(0,3));continue;
    }
    stuck.forEach(i=>{if(Math.random()<.5)G.boxes[i].dir=ri(0,3)});
  }
}
function layoutGrid(){
  const w=$('gridwrap'),cw=w.clientWidth-20,ch=w.clientHeight-20,gap=4;
  const s=Math.floor(Math.min((cw-gap*(G.C-1))/G.C,(ch-gap*(G.R-1))/G.R));
  const g=$('grid');g.style.gridTemplateColumns=`repeat(${G.C},${s}px)`;g.style.gridAutoRows=s+'px';
}
window.addEventListener('resize',()=>{if(G&&$('s1').classList.contains('on'))layoutGrid()});
function arrowSVG(deg){return `<svg class="ar" viewBox="0 0 24 24" style="transform:rotate(${deg}deg)" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h16M13 5l7 7-7 7"/></svg>`}
function renderGrid(){
  $('grid').innerHTML=G.boxes.map((b,i)=>`<div class="cell ${b.gone?'gone':''}" data-i="${i}"><button class="tile f${b.frame}">${arrowSVG(DIRDEG[b.dir])}</button></div>`).join('');
}
function renderTeam1(hit){
  $('team1').innerHTML=G.team.map((t,i)=>{
    const k=CLASSES[t.c.cls];
    return `<div class="tc ${t.found?'':'nf'} ${hit===i?'hit':''}" style="background:linear-gradient(${t.c.card[0]},${t.c.card[1]})"><span class="ci">${k.icon}</span>${catSVG(t.c)}
      <b>${t.found?'Lv'+t.level:'?'}</b><small>${t.found?'+'+Math.round(t.dmgB*100)+'% урон':t.c.name}</small></div>`}).join('');
}
function renderLuck(){$('luckf').style.width=(G.luck/G.thr*100)+'%';$('luckt').textContent=`Удача ${G.luck}/${G.thr}`}
function renderCombo(){
  const c=G.combo,k=c.cls?CLASSES[c.cls]:null;
  $('combo').innerHTML=`<span>Комбо ${k?k.icon:''}</span>`+[0,1,2].map(i=>`<span class="pip" style="${i<c.n?'background:'+k.color:''}"></span>`).join('')+`<span style="margin-left:auto">${G.opened}/${G.total}</span>`;
}
function renderInv(id){$(id).innerHTML=[0,1,2].map(i=>{const t=G.inv[i];return `<div class="slot ${t?'full':''}">${t?TRAPS[t].i:''}</div>`}).join('')}
function renderS1(){
  $('s1t').innerHTML=`Уровень ${G.lvl}<small>Этап 1 · Подготовка</small>`;
  renderGrid();renderTeam1();renderLuck();renderCombo();renderInv('inv1');
}
$('grid').onclick=e=>{
  if(paused||$('modal').classList.contains('on'))return;
  const el=e.target.closest('.cell');if(!el)return;
  tapBox(+el.dataset.i);
};
$('s1h').onclick=()=>{
  if(paused||!G)return;
  const free=G.boxes.map((b,i)=>i).filter(i=>!G.boxes[i].gone&&blockerOf(i)<0);
  if(!free.length)return;
  const t=$('grid').children[pick(free)].firstChild;
  t.classList.add('hint');setTimeout(()=>t.classList.remove('hint'),1900);
};
function tapBox(i){
  const b=G.boxes[i];if(b.gone)return;
  const bl=blockerOf(i),cell=$('grid').children[i],tile=cell.firstChild;
  if(bl>=0){
    sfx.nope();tile.classList.remove('shake');void tile.offsetWidth;tile.classList.add('shake');
    const bt=$('grid').children[bl].firstChild;bt.classList.remove('blocker');void bt.offsetWidth;bt.classList.add('blocker');
    setTimeout(()=>bt.classList.remove('blocker'),700);
    return;
  }
  b.gone=true;sfx.swoosh();
  tile.style.setProperty('--dx',DIRV[b.dir][1]);tile.style.setProperty('--dy',DIRV[b.dir][0]);
  tile.classList.add('fly');
  setTimeout(()=>cell.classList.add('gone'),420/speed);
  reward(i,cell);
}
function reveal(cell,inner){
  const d=document.createElement('div');d.className='reveal';d.innerHTML=inner;cell.appendChild(d);
  setTimeout(()=>d.remove(),950/speed);
}
function reward(i,cell){
  const b=G.boxes[i];G.opened++;
  const remaining=G.total-G.opened+1,unfound=G.team.filter(t=>!t.found);
  let hit=-1,bonusTier=0;
  if(unfound.length&&remaining<=unfound.length)hit=G.team.indexOf(pick(unfound));
  else if(Math.random()<.06){
    const trap=pick(Object.keys(TRAPS));
    reveal(cell,`<span class="ev">${TRAPS[trap].i}</span><em>ловушка</em>`);
    if(G.inv.length<3){G.inv.push(trap);toast('🎁 Ловушка: '+TRAPS[trap].n+' дверь')}else toast('🎁 Инвентарь ловушек полон');
    sfx.bonus();renderInv('inv1');
    return afterReward(0);
  }else hit=wpick(CAT_W);
  const t=G.team[hit],fr=FRAMES[b.frame];
  let isNew=false;
  if(t.found)t.level++;else{t.found=true;isNew=true}
  t.dmgB+=fr.dmg;t.asB+=fr.as;
  reveal(cell,catSVG(t.c)+`<em>${isNew?'NEW!':'Lv'+t.level}</em>`);
  (isNew?sfx.lvl:sfx.open)();
  const cb=G.combo;
  if(cb.cls===t.c.cls)cb.n++;else{cb.cls=t.c.cls;cb.n=1}
  if(cb.n>=3){
    G.team.forEach(x=>{if(x.found&&x.c.cls===cb.cls)x.level++});
    toast(`${CLASSES[cb.cls].icon} КОМБО! Все ${CLASSES[cb.cls].name} +1 уровень`,1800);sfx.lvl();
    cb.cls=null;cb.n=0;
  }
  if(b.frame>0){G.luck++;G.lastFrame=b.frame;if(G.luck>=G.thr)bonusTier=b.frame}
  renderTeam1(hit);setTimeout(()=>renderTeam1(),350);
  afterReward(bonusTier);
}
function afterReward(bonusTier){
  renderLuck();renderCombo();
  if(bonusTier)setTimeout(()=>offerBonus(bonusTier),420);
  else if(G.opened>=G.total)setTimeout(endStage1,600);
}
function offerBonus(tier){
  const order=[tier,...[1,2,3].filter(x=>x!==tier).sort((a,b)=>Math.abs(a-tier)-Math.abs(b-tier))];
  const avail=id=>!(BONUSES[id].trap&&G.inv.length>=3);
  let list=null;
  for(const k of order){const l=G.pool[k].filter(avail);if(l.length){list=l;break}}
  G.luck=0;G.picks++;G.thr=3+G.picks;renderLuck();
  if(!list){if(G.opened>=G.total)endStage1();return}
  const opts=[...list].sort(()=>Math.random()-.5).slice(0,3);
  sfx.bonus();
  modal(`<h3>🍀 Бонус удачи!</h3><p>Выбери один — остальные вернутся в пул</p><div class="opts">${opts.map(id=>{const B=BONUSES[id];
    return `<button class="opt t${B.t}" data-b="${id}"><span class="ic">${B.i}</span><span><b>${B.n}</b><small>${B.d}</small></span></button>`}).join('')}</div>`);
}
$('mbox').addEventListener('click',e=>{
  const o=e.target.closest('[data-b]');if(!o)return;
  const id=+o.dataset.b,B=BONUSES[id];
  G.pool[B.t]=G.pool[B.t].filter(x=>x!==id);
  G.b[id]=true;
  if(B.trap){G.inv.push(B.trap);renderInv('inv1')}
  if(id===5)G.tunaBonus++;
  closeModal();toast(B.i+' '+B.n,1400);sfx.lvl();
  if(G.opened>=G.total)setTimeout(endStage1,500);
});
function endStage1(){
  const lines=Object.keys(G.b).map(id=>BONUSES[id].i).join(' ')||'—';
  modal(`<h3>Поле очищено!</h3><p>Команда готова. Теперь — оборона дома.</p>
    <div class="fr">${G.team.map(t=>`<div class="tc" style="background:linear-gradient(${t.c.card[0]},${t.c.card[1]})">${catSVG(t.c)}<b>Lv${t.level}</b></div>`).join('')}</div>
    <p>Бонусы: ${lines}</p><div class="mrow"><button class="btn" id="goS2">К обороне! 🏠</button></div>`);
  $('goS2').onclick=()=>{closeModal();startStage2()};
}
$('s1x').onclick=$('s2x').onclick=()=>{speed=speed===1?2:1;setSpeed()};
function togglePause(){
  if(!G)return;
  paused=!paused;
  if(paused)modal(`<h3>⏸ Пауза</h3><p>Время остановлено</p><div class="mrow"><button class="btn" id="mResume">Продолжить</button><button class="btn sec" id="mQuit">В меню</button></div>`);
  else closeModal();
  $('mResume')&&($('mResume').onclick=togglePause);
  $('mQuit')&&($('mQuit').onclick=()=>{paused=false;closeModal();renderMenu()});

$('s1p').onclick=$('s2p').onclick=togglePause;

/* ============================================================
   STAGE 2 — SETUP
   ============================================================ */
const CW=360,CH=540;
let cv=$('cv'),ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
function fitCanvas(){cv.width=CW*dpr;cv.height=CH*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
const catCost=t=>CLASSES[t.c.cls].cost;
function buildPath(L){
  const pts=[],didx=[];
  L.rooms.forEach((rm,i)=>{rm.pts.forEach(p=>pts.push(p));if(i<L.doors.length){didx.push(pts.length);pts.push([L.doors[i].x,L.doors[i].y])}});
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  return{pts,cum,D:didx.map(i=>cum[i]),total:cum[cum.length-1]};
}
function posAt(path,s){
  const {pts,cum}=path;s=Math.max(0,Math.min(path.total,s));
  let i=1;while(i<pts.length-1&&cum[i]<s)i++;
  const a=pts[i-1],b=pts[i],len=cum[i]-cum[i-1]||1,t=(s-cum[i-1])/len;
  return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,nx:-(b[1]-a[1])/len,ny:(b[0]-a[0])/len,dx:(b[0]-a[0])/len};
}
function startStage2(){
  const L=LAYOUTS[layoutFor(G.lvl)],R=L.rooms.length;
  W={L,R,path:buildPath(L),spots:[],rats:[],proj:[],fx:[],zaps:[],sel:null,phase:'place',wave:0,spawnQ:[],spawnT:0,hudT:0,
     tuna:{hp:5+G.tunaBonus,max:5+G.tunaBonus,imm:0,used:false},fervor:0,sup:0,t:0,over:false,boss:null,bossSpawned:false,
     buffLeft:ri(2,3),buffSpot:-1,buffIn:0,menuDoor:-1,
     coins:G.team.reduce((a,t)=>a+catCost(t),0),
     doors:L.doors.map(d=>({...d,hp:35+G.lvl*8,max:35+G.lvl*8,trap:null,elecT:0,shake:0}))};
  const N=7+Math.min(2,Math.floor((G.lvl-1)/2)),cnt=Array(R).fill(Math.floor(N/R));
  for(let i=0;i<N%R;i++)cnt[i]++;
  L.rooms.forEach((rm,i)=>{for(let k=0;k<Math.min(cnt[i],rm.spots.length);k++)W.spots.push({x:rm.spots[k][0],y:rm.spots[k][1],room:i,cat:-1})});
  G.team.forEach(t=>{t.spot=-1;t.cd=0;t.shots=0;t.first=true;t.sharp=0;t.buffs=[]});
  W.buffSpot=ri(0,W.spots.length-1);
  fitCanvas();W.bg=makeBg(L);show('s2');paused=false;
  renderTray();updateHud();
  showBanner('Расставь котов!');
  if(!window.__noloop)requestAnimationFrame(loop);
}
function updateHud(){
  $('hCoin').textContent=fmt(W.coins);$('hFood').textContent=fmt(save.food);$('hGem').textContent=fmt(save.gems);
  $('hHp').textContent=`${W.tuna.hp}/${W.tuna.max}`;
  const go=$('go'),left=W.rats.filter(r=>!r.dead).length+W.spawnQ.length;
  if(W.phase==='place'||W.phase==='ready'){
    go.disabled=false;go.textContent=W.wave>=5?'ВЫЗВАТЬ БОССА':`НАЧАТЬ ВОЛНУ ${W.wave+1}`;
  }else{
    go.disabled=true;go.textContent=W.phase==='boss'?`БОСС · врагов ${left}`:`Волна ${W.wave}/5 · врагов ${left}`;
  }
  const sel=W.sel;
  $('status').textContent=sel?(sel.t==='tray'?`${G.team[sel.i].c.name} выбран — тапни свободное место`:'Тапни другое место или кота внизу, чтобы убрать'):(W.phase==='place'?'Тапни кота, затем место в доме':'Тапай двери — ловушки и ремонт');
}
function renderTray(){
  $('tray').innerHTML=G.team.map((t,i)=>{
    const k=CLASSES[t.c.cls],sel=W.sel&&W.sel.t==='tray'&&W.sel.i===i;
    const poor=t.spot<0&&W.coins<catCost(t);
    return `<div class="tc ${sel?'sel':''} ${t.spot>=0?'placed':''} ${poor?'poor':''}" data-i="${i}" style="background:linear-gradient(${t.c.card[0]},${t.c.card[1]})"><span class="ci">${k.icon}</span>${catSVG(t.c)}<b>Lv${t.level}</b>
      ${t.spot>=0?'<span class="cost">на месте</span>':`<span class="cost">🪙${catCost(t)}</span>`}
      <div class="pips">${t.buffs.map(()=>'<i></i>').join('')}</div></div>`}).join('');
  updateHud();
}
function showBanner(t){const b=$('banner');b.textContent=t;b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}
$('go').onclick=startNext;
function startNext(){
  if(!W||(W.phase!=='place'&&W.phase!=='ready'))return;
  if(!G.team.some(t=>t.spot>=0))return toast('Поставь хотя бы одного кота');
  W.tuna.used=false;G.team.forEach(t=>t.first=true);
  if(hasB(16))W.fervor=6;
  if(W.wave<5){
    W.wave++;const wd=makeWave(W.wave);W.spawnQ=wd.q;W.hpS=wd.hpS;W.spawnIv=wd.iv;W.spawnT=0;W.phase='wave';
    if(hasB(19)&&(W.wave===3||W.wave===5))W.sup=8;
    showBanner(`Волна ${W.wave}`);
  }else{
    W.phase='boss';showBanner('БОСС!');
    if(hasB(19))W.sup=8;
    spawnRat('boss',1);W.bossSpawned=true;W.spawnQ=Array(6).fill('normal');W.hpS=1+.16*(G.lvl-1)+.4;W.spawnIv=1.6;W.spawnT=1.5;
  }
  renderTray();
}

/* ============================================================
   STAGE 2 — INPUT
   ============================================================ */
function cvPoint(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*CW,y:(e.clientY-r.top)/r.height*CH}}
cv.addEventListener('pointerdown',e=>{
  if(!W||paused||W.over)return;
  const p=cvPoint(e);
  let best=-1,bd=26;
  W.spots.forEach((s,i)=>{const d=Math.hypot(s.x-p.x,s.y-p.y);if(d<bd){bd=d;best=i}});
  if(best>=0){closeTrapMenu();tapSpot(best);return}
  for(let i=0;i<W.doors.length;i++){

$('tray').addEventListener('click',e=>{

function tapSpot(si){
  const s=W.spots[si],sel=W.sel;

    const t=G.team[sel.i],occ=s.cat>=0?G.team[s.cat]:null;
    const need=(t.spot<0?catCost(t):0)-(occ?catCost(occ):0);
    if(need>W.coins){sfx.nope();toast('Не хватает монет 🪙');return}
    W.coins-=need;
    if(t.spot>=0)W.spots[t.spot].cat=-1;
    if(occ)occ.spot=-1;

/* ============================================================

const HPM=3.4;
const RAT_T={
  normal:{hp:4,v:36,dmg:1,iv:1,size:24},
  fast:{hp:2.5,v:60,dmg:.7,iv:.8,size:21},
  tank:{hp:13,v:26,dmg:2,iv:1,size:30},
  mini:{hp:70,v:22,dmg:4,iv:1,size:38},
  boss:{hp:420,v:17,dmg:9,iv:1.2,size:56}
};
function makeWave(w){
  const n=8+3*w+2*G.lvl,hpS=1+.16*(G.lvl-1)+.08*w,q=[];
  for(let i=0;i<n;i++){
    let k='normal';const r=Math.random();
    if(w>=2&&r<.25)k='fast';else if(w>=3&&r>.8)k='tank';
    q.push(k);
  }
  if(w===3||w===5)q.push('mini');
  return{q,hpS,iv:Math.max(.55,1-.07*w)};
}
function spawnRat(k,hpS){
  const T=RAT_T[k],hp=T.hp*HPM*(k==='boss'?1+.18*(G.lvl-1):hpS);
  const r={k,hp,max:hp,room:0,s:0,lane:rnd(-8,8),stop:rnd(14,40)+(k==='boss'?20:0),state:'walk',atkT:0,slowT:0,flash:0,dead:false,T,wob:Math.random()*6};
  W.rats.push(r);if(k==='boss')W.boss=r;return r;
}
const ratsIn=room=>W.rats.filter(r=>!r.dead&&r.room===room);
function ratPos(r){const p=posAt(W.path,r.s);return{x:p.x+p.nx*r.lane,y:p.y+p.ny*r.lane,dx:p.dx}}
function catDmg(t,target){
  let m=CLASSES[t.c.cls].dmg*(1+.07*(t.level-1))*(1+.03*(t.meta-1));
  const bd=t.buffs.filter(b=>b==='dmg').length*.1;
  m*=1+t.dmgB+bd+(hasB(1)?.1:0)+(hasB(14)?.25:0);
  if(hasB(20))m*=1.3;
  if(target&&target.k==='boss'&&hasB(12))m*=1.25;
  if(t.first&&hasB(11))m*=2;
  return m;
}
function catCd(t){
  const as=1+t.asB+t.buffs.filter(b=>b==='as').length*.1+(hasB(2)?.15:0)+(W.fervor>0?.25:0);
  let cd=CLASSES[t.c.cls].cd/as;
  if(W.sup>0)cd/=2;
  return cd*(1-.1*t.buffs.filter(b=>b==='cd').length);
}
const aoeR=t=>CELL*2*(1+.1*t.buffs.filter(b=>b==='rad').length+(hasB(4)?.2:0));
function hurt(r,dmg){
  if(r.dead)return;
  r.hp-=dmg;r.flash=.12;
  fxText(r,Math.round(dmg*10)/10);
  if(r.hp<=0)killRat(r);
}
function killRat(r){
  r.dead=true;const p=ratPos(r);
  W.fx.push({t:0,life:.4,k:'puff',x:p.x,y:p.y,s:r.T.size});
  const c=KILL_COIN[r.k];W.coins+=c;W.fx.push({t:0,life:.8,k:'coin',x:p.x,y:p.y-8,txt:'+'+c});sfx.coin();
  if(r.k==='boss')W.boss=null;
  if(hasB(15)){
    W.fx.push({t:0,life:.35,k:'ring',x:p.x,y:p.y,r:CELL*1.6,c:'#ff9f43'});
    W.rats.forEach(o=>{if(!o.dead&&o.room===r.room&&o!==r){const q=ratPos(o);if(Math.hypot(q.x-p.x,q.y-p.y)<CELL*1.6)hurt(o,2)}});
  }
  sfx.hit();
}
function fxText(r,txt){if(!txt)return;const p=ratPos(r);W.fx.push({t:0,life:.5,k:'num',x:p.x+rnd(-6,6),y:p.y-r.T.size*.5,txt})}
const slow=(r,t)=>{r.slowT=Math.max(r.slowT,t*(hasB(3)?1.1:1))};
function shoot(t,target){
  const sp=W.spots[t.spot],n=1+(hasB(9)&&t.shots%3===2?1:0);
  for(let i=0;i<n;i++){
    W.proj.push({x:sp.x,y:sp.y-4,tx:target,lx:0,ly:0,dmg:catDmg(t,target)*(i?.9:1),aoe:t.c.cls==='aoe'?aoeR(t):0,rico:true,c:CLASSES[t.c.cls].color,delay:i*.07});
    t.first=false;
  }
  t.shots++;t.cd=catCd(t);sfx.shot();
}
function step(dt){
  if(!W||W.over)return;
  W.t+=dt;
  W.fervor=Math.max(0,W.fervor-dt);W.sup=Math.max(0,W.sup-dt);
  if(W.tuna.imm>0)W.tuna.imm-=dt;
  if(W.phase==='wave'||W.phase==='boss'){
    if(W.spawnQ.length){
      W.spawnT-=dt;
      if(W.spawnT<=0){spawnRat(W.spawnQ.shift(),W.hpS);W.spawnT=W.spawnIv}
    }else if(W.phase==='wave'&&!W.rats.some(r=>!r.dead)){W.phase='ready';showBanner(`Волна ${W.wave} отбита!`);renderTray()}
  }
  W.hudT-=dt;if(W.hudT<=0){W.hudT=.25;updateHud()}
  if(W.buffLeft>0&&W.buffSpot<0){W.buffIn-=dt;if(W.buffIn<=0)W.buffSpot=pick(W.spots.map((s,i)=>i).filter(i=>i!==W.lastBuff))}
  G.team.forEach(t=>{
    if(t.spot<0)return;
    if(t.sharp>0){
      t.sharp-=dt;
      if(t.sharp<=0){
        const sp=W.spots[t.spot];
        if(t.buffs.length<3){const b=pick(['dmg','as','rad','cd']);t.buffs.push(b);
          W.fx.push({t:0,life:.9,k:'text',x:sp.x,y:sp.y-24,txt:{dmg:'+10% урон',as:'+10% скор.',rad:'+10% радиус',cd:'−10% КД'}[b],c:'#FFD43B'});renderTray()}
        W.buffLeft--;W.lastBuff=W.buffSpot;W.buffSpot=-1;W.buffIn=rnd(10,16);
      }
      return;
    }
    if(W.buffSpot>=0&&t.spot===W.buffSpot){t.sharp=rnd(3,5);return}
    const sp=W.spots[t.spot],en=ratsIn(sp.room);
    if(!en.length)return;
    t.cd-=dt;
    if(t.cd<=0){
      const big=en.filter(r=>r.k==='boss'||r.k==='mini');
      shoot(t,(big.length?big:en).reduce((a,b)=>b.s>a.s?b:a));
    }
  });
  for(const p of W.proj){
    if(p.delay>0){p.delay-=dt;continue}
    if(p.tx&&!p.tx.dead){const q=ratPos(p.tx);p.lx=q.x;p.ly=q.y}
    if(!p.lx&&!p.ly){p.dead=true;continue}
    const dx=p.lx-p.x,dy=p.ly-p.y,d=Math.hypot(dx,dy),mv=480*dt;
    if(d<=mv+4){
      p.dead=true;
      if(p.tx&&!p.tx.dead){
        hurt(p.tx,p.dmg);
        if(p.aoe){
          W.fx.push({t:0,life:.3,k:'ring',x:p.lx,y:p.ly,r:p.aoe,c:'#38BDF8'});
          slow(p.tx,1.5);
          ratsIn(p.tx.room).forEach(o=>{if(o!==p.tx){const q=ratPos(o);if(Math.hypot(q.x-p.lx,q.y-p.ly)<p.aoe){hurt(o,p.dmg*.4);slow(o,1.5)}}});
        }
        if(p.rico&&hasB(10)&&Math.random()<.15){
          const o=ratsIn(p.tx.room).filter(x=>x!==p.tx);
          if(o.length)W.proj.push({x:p.lx,y:p.ly,tx:pick(o),lx:0,ly:0,dmg:p.dmg,aoe:0,rico:false,c:'#fff',delay:0});
        }
      }
    }else{p.x+=dx/d*mv;p.y+=dy/d*mv}
  }
  W.proj=W.proj.filter(p=>!p.dead);
  const sh=1-(hasB(8)?.1:0)-(hasB(13)?.25:0),P=W.path;
  for(const r of W.rats){
    if(r.dead)continue;
    r.flash=Math.max(0,r.flash-dt);r.slowT=Math.max(0,r.slowT-dt);
    const door=W.doors[r.room];
    if(r.state==='walk'){
      r.s+=r.T.v*(hasB(7)?.9:1)*(r.slowT>0?.7:1)*dt;
      if(!door){
        if(r.s>=P.total-8-r.stop*.35){hitTuna(r);continue}
      }else if(door.hp>0){
        const stopS=P.D[r.room]-r.stop;
        if(r.s>=stopS){r.s=stopS;r.state='atk';r.atkT=hasB(6)?.3:0}
      }else if(r.s>=P.D[r.room])r.room++;
    }else{
      if(door.hp<=0){r.state='walk';continue}
      r.atkT-=dt;
      if(r.atkT<=0){
        r.atkT=r.T.iv;
        door.hp-=r.T.dmg*sh;sfx.door();door.shake=.15;
        if(door.trap==='spike')hurt(r,1);
        if(door.hp<=0)breakDoor(r.room);
      }
    }
  }
  W.doors.forEach((d,i)=>{
    if(d.hp<=0||d.trap!=='elec')return;
    const atk=W.rats.filter(r=>!r.dead&&r.room===i&&r.state==='atk');
    d.elecT-=dt;
    if(atk.length&&d.elecT<=0){
      d.elecT=1;
      const first=atk.reduce((a,b)=>b.s>a.s?b:a),chain=[first],used=new Set([first]);
      for(let k=0;k<2;k++){
        const lp=ratPos(chain[chain.length-1]);let best=null,bd=CELL*2;
        for(const o of ratsIn(i)){if(used.has(o))continue;const q=ratPos(o),dd=Math.hypot(q.x-lp.x,q.y-lp.y);if(dd<bd){bd=dd;best=o}}

    }
  });
  for(const z of W.zaps){
    z.t-=dt;

      z.done=true;
      if(!z.r.dead){
        const a=z.from&&!z.from.dead?ratPos(z.from):null,b=ratPos(z.r);

    }
  }
  W.zaps=W.zaps.filter(z=>!z.done);
  W.doors.forEach(d=>{if(d.shake>0)d.shake-=dt});
  W.rats=W.rats.filter(r=>!r.dead);
  W.fx.forEach(f=>f.t+=dt);W.fx=W.fx.filter(f=>f.t<f.life);
  if(W.phase==='boss'&&W.bossSpawned&&!W.boss&&!W.over)endLevel(true);

}
function breakDoor(i){

/* ============================================================
   STAGE 2 — DRAW (дом сверху)

function rr(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)}
function distSeg(px,py,a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/l2));

}
function distRect(px,py,x,y,w,h){const dx=Math.max(x-px,0,px-(x+w)),dy=Math.max(y-py,0,py-(y+h));return Math.hypot(dx,dy)}
const FURN={ // [тип,w,h]
  'Коридор':[['bench',58,18],['plant',22,22]],'Кухня':[['counter',70,20],['table',34,34]],'Гостиная':[['sofa',66,26],['tv',48,14]],

    desk:['#c98b4e','#a86c34'],shelf:['#a86c34','#865020'],bed:['#9ad2ff','#5ba8ee'],wardrobe:['#c98b4e','#9a6330']}[type];

}
function makeBg(L){

    const sh2=c.createLinearGradient(0,rm.y,0,rm.y+44);sh2.addColorStop(0,'rgba(60,30,0,.32)');sh2.addColorStop(1,'rgba(60,30,0,0)');c.fillStyle=sh2;c.fillRect(rm.x,rm.y,rm.w,44);

        const cd=cand[k];let x=cd[0],y=cd[1];const f=cd[2]||'';
        if(f.includes('r'))x-=w;if(f==='m'||f==='mb')x-=w/2;if(f.includes('b'))y-=h;
        if(x<rm.x+8||y<rm.y+8||x+w>rm.x+rm.w-8||y+h>rm.y+rm.h-8)continue;
        let ok=true;
        for(let q=1;q<P.pts.length&&ok;q++){ // не лезем на тропу
          for(const [qx,qy] of [[x,y],[x+w,y],[x,y+h],[x+w,y+h],[x+w/2,y+h/2]])if(distSeg(qx,qy,P.pts[q-1],P.pts[q])<24){ok=false;break}
        }
        rm.spots.forEach(s=>{if(distRect(s[0],s[1],x,y,w,h)<24)ok=false});
        (rm._f||[]).forEach(fq=>{if(x<fq[0]+fq[2]+6&&x+w+6>fq[0]&&y<fq[1]+fq[3]+6&&y+h+6>fq[1])ok=false});
        if(!ok)continue;
        drawFurn(c,type,x,y,w,h);(rm._f=rm._f||[]).push([x,y,w,h]);used++;cand.splice(k,1);break;
      }
    }
    rm._f=null;
  });
  // стены
  L.rooms.forEach((rm,i)=>{
    c.strokeStyle='rgba(40,20,0,.25)';c.lineWidth=9;rr(c,rm.x+1,rm.y+4,rm.w,rm.h,3);c.stroke();
    c.strokeStyle=WALL[i%5];c.lineWidth=9;rr(c,rm.x,rm.y,rm.w,rm.h,3);c.stroke();
    c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=2;rr(c,rm.x+3,rm.y+3,rm.w-6,rm.h-6,2);c.stroke();
    const win=(x,y,w,h)=>{c.fillStyle='#effcff';rr(c,x,y,w,h,2);c.fill();c.fillStyle='#8fd8f0';c.fillRect(x+1.5,y+1.5,w/2-2,h-3);c.fillRect(x+w/2+.5,y+1.5,w/2-2,h-3)};
    if(rm.x<=10)win(4,rm.y+rm.h/2-14,11,28);
    if(rm.x+rm.w>=350)win(345,rm.y+rm.h/2-14,11,28);
    if(rm.y<=10){win(rm.x+rm.w*.3-14,4,28,11);win(rm.x+rm.w*.75-14,4,28,11)}
    if(rm.y+rm.h>=530)win(rm.x+rm.w*.3-14,525,28,11);
    c.fillStyle='rgba(255,255,255,.8)';c.font='700 11px Fredoka,sans-serif';c.shadowColor='rgba(40,20,0,.5)';c.shadowBlur=3;
    c.fillText(L.names[i],rm.x+13,rm.y+rm.h-12);c.shadowBlur=0;
  });
  const s0=L.rooms[0].pts[0];c.fillStyle='#2b1a3f';c.beginPath();c.ellipse(s0[0]-16,s0[1],7,12,0,0,7);c.fill();
  return o;
}
function drawImg(c,im,x,y,s,flip){
  if(!im.complete||!im.naturalWidth)return;
  if(flip){c.save();c.translate(x,y);c.scale(-1,1);c.drawImage(im,-s/2,-s/2,s,s);c.restore()}
  else c.drawImage(im,x-s/2,y-s/2,s,s);
}
function draw(){
  if(!W)return;
  const c=ctx;
  c.clearRect(0,0,CW,CH);
  c.drawImage(W.bg,0,0,CW,CH);
  const P=W.path,e=P.pts[P.pts.length-1];
  if(W.tuna.imm>0){c.fillStyle='rgba(255,212,59,'+(.3+.15*Math.sin(W.t*8))+')';c.beginPath();c.arc(e[0],e[1],28,0,7);c.fill()}
  drawImg(c,fishImg(),e[0],e[1],44);
  W.doors.forEach((d,i)=>{
    const sx=d.shake>0?rnd(-1.5,1.5):0,hz=d.o==='h',w=hz?34:12,h=hz?12:34;
    if(d.hp>0){
      c.fillStyle='rgba(40,20,0,.35)';rr(c,d.x-w/2-1+sx,d.y-h/2+2,w+4,h+4,5);c.fill();
      c.fillStyle='#8a5526';rr(c,d.x-w/2-2+sx,d.y-h/2-2,w+4,h+4,5);c.fill();
      c.fillStyle='#d28a44';rr(c,d.x-w/2+sx,d.y-h/2,w,h,4);c.fill();
      c.fillStyle='rgba(255,255,255,.35)';c.fillRect(d.x-w/2+2+sx,d.y-h/2+1.5,w-4,2);
      c.fillStyle='#ffe27a';c.beginPath();c.arc(d.x+(hz?8:0)+sx,d.y+(hz?0:8),2.4,0,7);c.fill();
      const f=Math.max(0,d.hp/d.max),bx=d.x-17,by=d.y-h/2-12;
      c.fillStyle='rgba(6,54,111,.7)';rr(c,bx,by,34,6,3);c.fill();
      c.fillStyle=f>.5?'#32D583':f>.25?'#FFD43B':'#ff5d73';rr(c,bx,by,Math.max(2,34*f),6,3);c.fill();
      c.textAlign='center';
      if(d.trap){c.font='15px sans-serif';c.fillText(TRAPS[d.trap].i,d.x,d.y+(hz?24:-0)+(hz?0:26))}
      c.textAlign='left';
    }else{
      c.fillStyle=FLOOR[i%5][0];rr(c,d.x-w/2,d.y-h/2,w,h,2);c.fill();
      c.fillStyle='rgba(90,50,20,.7)';c.fillRect(d.x-4,d.y-3,5,5);c.fillRect(d.x+2,d.y+2,4,4);
    }
  });
  W.spots.forEach((s,i)=>{
    const isSel=W.sel&&W.sel.t==='spot'&&W.sel.i===i,canPlace=W.sel&&W.sel.t==='tray'&&s.cat<0;
    c.beginPath();c.arc(s.x,s.y,17,0,7);
    c.fillStyle=i===W.buffSpot?'rgba(255,212,59,.45)':canPlace?'rgba(255,255,255,.55)':'rgba(255,255,255,.3)';c.fill();
    c.lineWidth=2.4;c.setLineDash([5,4]);
    c.strokeStyle=isSel?'#FF9F1C':'#fff';c.stroke();c.setLineDash([]);
    if(canPlace){c.fillStyle='#fff';c.globalAlpha=.6+.4*Math.sin(W.t*6);c.beginPath();c.arc(s.x,s.y,5,0,7);c.fill();c.globalAlpha=1}
    if(i===W.buffSpot){
      const pul=1+.08*Math.sin(W.t*5);
      c.fillStyle='#c98b4e';rr(c,s.x+7,s.y-1,9*pul,16,3);c.fill();
      c.strokeStyle='#7a4a1e';c.lineWidth=1.2;for(let k=0;k<3;k++){c.beginPath();c.moveTo(s.x+9,s.y+3+k*4);c.lineTo(s.x+14,s.y+3+k*4);c.stroke()}
      c.fillStyle='#fff';c.font='700 9px Fredoka,sans-serif';c.textAlign='center';c.shadowColor='#7a4a1e';c.shadowBlur=3;c.fillText('БАФФ',s.x,s.y+30);c.shadowBlur=0;c.textAlign='left';
    }
  });
  const items=[];
  G.team.forEach(t=>{if(t.spot>=0){const s=W.spots[t.spot];items.push({y:s.y,cat:t,s})}});
  W.rats.forEach(r=>{if(!r.dead){const p=ratPos(r);items.push({y:p.y,rat:r,p})}});
  items.sort((a,b)=>a.y-b.y);
  for(const it of items){
    if(it.cat){
      const t=it.cat,s=it.s,k=CLASSES[t.c.cls];
      const sel=W.sel&&W.sel.t==='spot'&&W.sel.i===t.spot;
      const sharp=t.sharp>0,shake=sharp?Math.sin(W.t*30)*2:0;
      const bob=ratsIn(s.room).length&&!sharp?Math.sin(W.t*10+t.spot)*1.5:0;
      c.fillStyle='rgba(40,20,0,.28)';c.beginPath();c.ellipse(s.x,s.y+13,13,5,0,0,7);c.fill();
      c.fillStyle='rgba(255,255,255,.65)';c.beginPath();c.arc(s.x,s.y,19,0,7);c.fill();
      c.lineWidth=3.5;c.strokeStyle=sel?'#FF9F1C':k.color;c.beginPath();c.arc(s.x,s.y,19,0,7);c.stroke();
      drawImg(c,catImg(t.c),s.x+shake,s.y-2+bob,34);
      c.fillStyle='rgba(7,80,168,.9)';rr(c,s.x-13,s.y+9,26,12,6);c.fill();
      c.fillStyle='#fff';c.font='700 9.5px Fredoka,sans-serif';c.textAlign='center';c.fillText(k.icon+t.level,s.x,s.y+18.5);c.textAlign='left';
      if(sharp){c.strokeStyle='#FF9F1C';c.lineWidth=3;c.beginPath();c.arc(s.x,s.y,23.5,-1.57,-1.57+6.28*(1-t.sharp/5));c.stroke()}
      if(!sharp&&ratsIn(s.room).length){const f=1-Math.max(0,t.cd)/catCd(t);c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=2;c.beginPath();c.arc(s.x,s.y,23,-1.57,-1.57+6.28*Math.min(1,f));c.stroke()}
    }else{
      const r=it.rat,p=it.p,T=r.T,s=T.size,w=Math.sin(W.t*9+r.wob)*1.6;
      c.fillStyle='rgba(40,20,0,.28)';c.beginPath();c.ellipse(p.x,p.y+s*.38,s*.4,s*.14,0,0,7);c.fill();
      if(r.flash>0)c.globalAlpha=.55;
      if(r.slowT>0){c.fillStyle='rgba(56,189,248,.4)';c.beginPath();c.arc(p.x,p.y,s*.62,0,7);c.fill()}
      drawImg(c,ratImg(r.k),p.x,p.y+w,s,p.dx<0);
      c.globalAlpha=1;
      if(r.hp<r.max){const f=r.hp/r.max,bw=Math.max(18,s*.8);c.fillStyle='rgba(6,54,111,.75)';rr(c,p.x-bw/2,p.y-s*.62,bw,5,2.5);c.fill();c.fillStyle=r.k==='boss'||r.k==='mini'?'#ff5d73':'#32D583';rr(c,p.x-bw/2,p.y-s*.62,Math.max(2,bw*f),5,2.5);c.fill()}
    }
  }
  for(const p of W.proj){if(p.delay>0)continue;c.fillStyle=p.c;c.shadowColor=p.c;c.shadowBlur=8;c.beginPath();c.arc(p.x,p.y,p.aoe?4.5:3.2,0,7);c.fill();c.shadowBlur=0}
  for(const f of W.fx){
    const a=f.t/f.life;
    if(f.k==='ring'){c.strokeStyle=f.c;c.globalAlpha=1-a;c.lineWidth=3;c.beginPath();c.arc(f.x,f.y,f.r*(.3+.7*a),0,7);c.stroke();c.globalAlpha=1}
    else if(f.k==='puff'){c.globalAlpha=1-a;c.fillStyle='#fff';for(let k=0;k<5;k++){const an=k*1.25+f.x;c.beginPath();c.arc(f.x+Math.cos(an)*a*f.s*.7,f.y+Math.sin(an)*a*f.s*.7,4*(1-a)+1,0,7);c.fill()}c.globalAlpha=1}
    else if(f.k==='num'||f.k==='text'||f.k==='coin'){
      c.globalAlpha=Math.min(1,2-2*a);c.textAlign='center';c.shadowColor='rgba(7,80,168,.9)';c.shadowBlur=4;
      c.fillStyle=f.k==='coin'?'#FFD43B':f.k==='num'?'#fff':f.c;c.font=(f.k==='num'?'700 11px':'700 13px')+' Fredoka,sans-serif';
      c.fillText((f.k==='coin'?'🪙':'')+f.txt,f.x,f.y-a*(f.k==='num'?16:22));c.shadowBlur=0;c.textAlign='left';c.globalAlpha=1}
    else if(f.k==='bolt'){
      c.globalAlpha=1-a;c.strokeStyle='#e8fbff';c.shadowColor='#38BDF8';c.shadowBlur=10;c.lineWidth=2.5;c.beginPath();c.moveTo(f.x,f.y);
      for(let k=1;k<5;k++)c.lineTo(f.x+(f.x2-f.x)*k/5+rnd(-5,5),f.y+(f.y2-f.y)*k/5+rnd(-5,5));
      c.lineTo(f.x2,f.y2);c.stroke();c.shadowBlur=0;c.globalAlpha=1}
  }
  if(W.fervor>0||W.sup>0){c.fillStyle='#fff';c.shadowColor='#0750A8';c.shadowBlur=4;c.font='700 12px Fredoka,sans-serif';c.fillText((W.sup>0?'🚀 ×2 ':'🔥 +25% ')+Math.ceil(Math.max(W.sup,W.fervor))+'с',14,CH-8);c.shadowBlur=0}
}
let last=0;
function loop(t){
  if(!W||W.over)return;
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(!paused&&!window.__manual){for(let i=0;i<speed;i++)step(dt)}
  draw();
  requestAnimationFrame(loop);
}

/* ============================================================
   END LEVEL
   ============================================================ */
function endLevel(win){
  if(W.over)return;W.over=true;draw();updateHud();
  if(!win){
    sfx.lose();
    setTimeout(()=>{modal(`<p class="big">😿</p><h3>Тунец пропал!</h3><p>Крысы добрались до добычи. Попробуем ещё раз?</p>
      <div class="mrow"><button class="btn" id="rt">Ещё раз</button><button class="btn sec" id="mn">В меню</button></div>`);
      $('rt').onclick=()=>{closeModal();startLevel(G.lvl)};$('mn').onclick=()=>{closeModal();renderMenu()}},700);
    return;
  }
  sfx.win();
  const doors=W.doors.filter(d=>d.hp>0).length,mult=hasB(17)?2:1;
  const got={fast:0,strong:0,aoe:0},cls=pick(Object.keys(CLASSES));
  got[cls]+=ri(3,5)*mult;got.aoe+=mult;got[cls]+=doors;
  Object.keys(got).forEach(k=>save.frags[k]+=got[k]);
  const coins=80+25*doors+10*G.lvl,gems=2+(doors===W.doors.length?3:0),food=5+doors;
  save.coins+=coins;save.gems+=gems;save.food+=food;
  const stars=[1,W.tuna.hp>=W.tuna.max?1:0,doors===W.doors.length?1:0],old=save.stars[G.lvl]||[0,0,0];
  save.stars[G.lvl]=stars.map((s,i)=>s||old[i]);
  const lvlUp=[];
  G.team.forEach(t=>{const m=metaOf(t.c.id);m.xp+=30;while(m.xp>=xpNeed(m.lv)){m.xp-=xpNeed(m.lv);m.lv++;lvlUp.push(t.c.name)}});
  if(G.lvl===save.level)save.level++;
  menuLvl=Math.min(G.lvl+1,save.level);
  persist();
  setTimeout(()=>{
    modal(`<h3>Босс повержен!</h3><div class="stars">${stars.map(s=>s?'⭐':'☆').join('')}</div><p>Целых дверей: ${doors}/${W.doors.length}</p>
      <div class="fr">${Object.keys(got).filter(k=>got[k]).map(k=>`<span class="chip" style="font-size:18px;background:${CLASSES[k].color}">${CLASSES[k].icon} +${got[k]}</span>`).join('')}
      <span class="chip" style="font-size:18px;background:#FFD43B">🪙 +${coins}</span><span class="chip" style="font-size:18px;background:#ffb27a">🍖 +${food}</span><span class="chip" style="font-size:18px;background:#c4b0ff">💎 +${gems}</span></div>
      <p>${mult>1?'Двойная удача: фрагменты босса ×2!<br>':''}${lvlUp.length?'⬆️ Выросли: '+lvlUp.join(', '):'Все коты получили опыт'}</p>
      <div class="mrow"><button class="btn" id="nx">Дальше</button><button class="btn sec" id="mn">В меню</button></div>`);
    $('nx').onclick=()=>{closeModal();startLevel(menuLvl)};
    $('mn').onclick=()=>{closeModal();renderMenu()};
  },900);
}

window.__dbg={get G(){return G},get W(){return W},step,startLevel,tapBox,blockerOf,startStage2,startNext,tapSpot,endStage1,draw,save:()=>save};
renderMenu();
</script>
